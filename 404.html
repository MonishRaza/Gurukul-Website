<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title data-i18n="title.notfound">Page Not Found — Gurukul Academy</title>
  <link rel="icon" type="image/png" href="images/logo.png">
  <link rel="stylesheet" href="css/style.css?v=9">
  <script>
    document.documentElement.className += " js";
    // Anti-FOUC: apply the stored language before the page paints.
    try {
      if (localStorage.getItem("gurukul_lang") === "hi") {
        document.documentElement.setAttribute("lang", "hi");
        document.documentElement.classList.add("lang-hi");
      }
    } catch (e) {}
  </script>
</head>
<body data-page="">

  <header id="site-header">
  <div class="topbar" id="topbar"></div>
  <div class="container header-inner">
    <a class="brand" href="index.html">
      <span class="brand-logo-wrap">
        <img class="brand-logo" src="images/logo.png" alt="Gurukul Academy logo">
      </span>
      <span class="brand-text">
        <strong>Gurukul Academy</strong>
        <small data-i18n="brand.small">Higher Secondary School &middot; Est. 2013</small>
      </span>
    </a>
    <nav class="site-nav" aria-label="Main navigation">
      <a href="index.html" data-i18n="nav.home">Home</a>
      <a href="about.html" data-i18n="nav.about">About</a>
      <a href="gallery.html" data-i18n="nav.gallery">Gallery</a>
      <a href="index.html#social" data-i18n="nav.social">Social Presence</a>
      <a href="contact.html" data-i18n="nav.contact">Contact</a>
      <a href="feedback.html" data-i18n="nav.feedback">Feedback</a>
      <a class="nav-staff" href="https://app.gurukulamarpatan.in" target="_blank" rel="noopener" data-i18n="nav.staffPlain">Staff Portal</a>
    </nav>
  </div>
</header>

  <main class="notfound">
    <div class="code">404</div>
    <h1 data-i18n="notfound.title">Page not found</h1>
    <p data-i18n="notfound.text">The page you are looking for doesn't exist or may have moved.</p>
    <a class="btn btn-blue" href="index.html" data-i18n="notfound.back">Back to Home</a>
  </main>

  <div id="site-footer"></div>

  <script src="js/site-config.js?v=9"></script>
  <script src="js/i18n.js?v=9" defer></script>
  <script src="js/main.js?v=9" defer></script>
</body>
</html>
